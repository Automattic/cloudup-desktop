# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---
# Variables used in this pipeline are defined in `shared-pipeline-vars`, which is `source`'d before calling `buildkite-agent pipeline upload`

steps:
  - label: ":mac: Build & Sign Desktop App"
    command: .buildkite/desktop/commands/build-and-sign.sh
    agents:
      queue: mac
    plugins:
      - $CI_TOOLKIT_PLUGIN
      - $NVM_PLUGIN
    artifact_paths:
      - apps/desktop/release/*.dmg
      - apps/desktop/release/*.zip
    env:
      CLOUDUP_ENV: staging
      IMAGE_ID: $IMAGE_ID
