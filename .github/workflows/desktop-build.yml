name: Desktop App Build

on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - production
          - staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        env:
          CLOUDUP_ENV: ${{ github.event.inputs.environment || 'staging' }}
        run: npm run build && npx electron-builder --mac --publish never

      - name: List release artifacts
        run: ls -la release/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: cloudup-desktop-mac-${{ github.event.inputs.environment || 'staging' }}
          path: release/*.dmg
          retention-days: 30

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cloudup-desktop-mac-zip-${{ github.event.inputs.environment || 'staging' }}
          path: release/*.zip
          retention-days: 30
